<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image → WebP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f8f8;
      padding: 2rem;
      max-width: 420px;
      margin: auto;
      text-align: center;
    }

    #dropZone {
      border: 2px dashed #aaa;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 1rem;
      cursor: pointer;
      background: #fff;
    }

    #dropZone.hover {
      border-color: #000;
      background: #f0f0f0;
    }

    input[type="file"] {
      display: none;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 0.5rem;
    }

    img {
      max-width: 100%;
      margin-top: 1rem;
      border-radius: 8px;
    }

    a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.4rem 0.8rem;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }

    small {
      color: #666;
    }

    .preview-item {
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <h2>Image → WebP</h2>
  <small>Client-side. No upload.</small>

  <div id="dropZone">Drag & drop images here or click to select</div>
  <input type="file" accept="image/*" id="fileInput" multiple />

  <label>
    Quality: <strong><span id="qValue">0.6</span></strong>
    <input
      type="range"
      min="0.1"
      max="1"
      step="0.05"
      value="0.6"
      id="quality"
    />
  </label>

  <div id="previewContainer"></div>

  <script>
    const fileInput = document.getElementById("fileInput")
    const dropZone = document.getElementById("dropZone")
    const qualityInput = document.getElementById("quality")
    const qValue = document.getElementById("qValue")
    const previewContainer = document.getElementById("previewContainer")

    qValue.textContent = qualityInput.value

    function processImage(file, maxSize = 512, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const img = new Image()
        const reader = new FileReader()

        reader.onload = () => img.src = reader.result
        reader.onerror = reject
        reader.readAsDataURL(file)

        img.onload = () => {
          const canvas = document.createElement("canvas")
          const ctx = canvas.getContext("2d")
          const scale = Math.min(maxSize / img.width, maxSize / img.height, 1)

          canvas.width = img.width * scale
          canvas.height = img.height * scale
          ctx.clearRect(0, 0, canvas.width, canvas.height)
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height)

          canvas.toBlob(blob => {
            if (!blob) return reject("Conversion failed")
            const reader2 = new FileReader()
            reader2.onload = () => resolve(reader2.result)
            reader2.readAsDataURL(blob)
          }, "image/webp", quality)
        }
      })
    }

    async function convertFiles(files) {
      if (!files || files.length === 0) return
      const quality = parseFloat(qualityInput.value)
      qValue.textContent = quality
      previewContainer.innerHTML = ''

      for (const file of files) {
        try {
          const webp = await processImage(file, 2048, quality)

          const container = document.createElement('div')
          container.className = 'preview-item'

          const imgEl = document.createElement('img')
          imgEl.src = webp
          imgEl.alt = file.name

          const a = document.createElement('a')
          a.href = webp
          a.download = file.name.replace(/\.\w+$/, ".webp")
          a.textContent = `Download ${file.name}`

          container.appendChild(imgEl)
          container.appendChild(a)
          previewContainer.appendChild(container)
        } catch (err) {
          console.error('Conversion failed for', file.name, err)
        }
      }
    }

    // File input selection
    fileInput.addEventListener("change", () => convertFiles(fileInput.files))

    // Drag & drop
    dropZone.addEventListener("dragover", e => {
      e.preventDefault()
      dropZone.classList.add("hover")
    })

    dropZone.addEventListener("dragleave", e => {
      e.preventDefault()
      dropZone.classList.remove("hover")
    })

    dropZone.addEventListener("drop", e => {
      e.preventDefault()
      dropZone.classList.remove("hover")
      const files = e.dataTransfer.files
      convertFiles(files)
    })

    // Click drop zone to open file picker
    dropZone.addEventListener("click", () => fileInput.click())

    // Update quality
    qualityInput.addEventListener("input", () => {
      qValue.textContent = qualityInput.value
      // optionally re-run conversion if files already selected
      if (fileInput.files.length > 0) convertFiles(fileInput.files)
    })
  </script>

</body>
</html>
